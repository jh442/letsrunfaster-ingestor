[project]
name = "garmin-ingestor"
version = "0.1.0"
description = "Bulk export activities from Garmin Connect (FIT/GPX) to local storage or remote API"
authors = [{ name = "Joffroi" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "fitparse>=1.2.0",
    "garminconnect>=0.3.11",
    "garth>=0.8.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
]

[project.scripts]
garmin-ingestor = "garmin_engine.cli:app"
lrf-ingestor = "garmin_engine.cli:app"

[tool.setuptools.packages.find]
include = ["garmin_engine*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
